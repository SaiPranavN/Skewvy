<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Skewvy modular S favicon</title>
  <desc id="desc">A white letter S assembled from culture, person, news, school, and city components on a carrot-orange neo-brutalist tile with a hard black shadow.</desc>

  <rect x="10" y="10" width="492" height="492" rx="36" fill="#11100F"/>
  <rect x="10" y="10" width="472" height="472" rx="30" fill="#FF704D" stroke="#11100F" stroke-width="12"/>

  <defs>
    <path id="s-mark" d="M404 78H184C108 78 64 116 64 180c0 62 41 93 120 108l112 22c27 5 38 16 38 34 0 21-17 32-51 32H91v76h202c80 0 131-43 131-112 0-65-41-98-122-114l-105-21c-25-5-34-15-34-31 0-18 15-28 44-28h197Z"/>
    <clipPath id="s-clip"><use xlink:href="#s-mark"/></clipPath>
  </defs>

  <!-- hard, unblurred neo-brutalist shadow -->
  <use xlink:href="#s-mark" transform="translate(15 17)" fill="#11100F" stroke="#11100F" stroke-width="10"/>

  <!-- unmistakable white S silhouette -->
  <use xlink:href="#s-mark" fill="#FFF8EA" stroke="#11100F" stroke-width="10" stroke-linejoin="round"/>

  <!-- carrot gutters divide the S into its smaller subjects -->
  <g clip-path="url(#s-clip)" fill="none" stroke="#FF704D" stroke-width="14">
    <path d="M278 68 250 169"/>
    <path d="M86 250 413 299"/>
    <path d="M225 307 208 457"/>
  </g>

  <!-- components living inside the S -->
  <g clip-path="url(#s-clip)" fill="#11100F">
    <!-- show / ticket -->
    <path d="M91 99h167l-10 51H101Z"/>
    <circle cx="121" cy="124" r="6" fill="#FFF8EA"/>
    <circle cx="145" cy="124" r="6" fill="#FFF8EA"/>
    <circle cx="169" cy="124" r="6" fill="#FFF8EA"/>
    <rect x="193" y="116" width="40" height="16" fill="#FFF8EA"/>

    <!-- person -->
    <circle cx="335" cy="111" r="24"/>
    <path d="M292 197c4-42 18-63 43-63s39 21 43 63Z"/>

    <!-- public story / headline -->
    <rect x="176" y="218" width="42" height="38"/>
    <rect x="231" y="220" width="120" height="12"/>
    <rect x="231" y="245" width="88" height="12"/>

    <!-- school / institution -->
    <path d="M93 351 150 310l57 41h-12v77H105v-77Z"/>
    <rect x="123" y="357" width="13" height="51" fill="#FFF8EA"/>
    <rect x="147" y="357" width="13" height="51" fill="#FFF8EA"/>
    <rect x="171" y="357" width="13" height="51" fill="#FFF8EA"/>

    <!-- city / organisation -->
    <rect x="244" y="342" width="139" height="91"/>
    <rect x="261" y="360" width="21" height="18" fill="#FFF8EA"/>
    <rect x="297" y="360" width="21" height="18" fill="#FFF8EA"/>
    <rect x="333" y="360" width="21" height="18" fill="#FFF8EA"/>
    <rect x="261" y="393" width="21" height="18" fill="#FFF8EA"/>
    <rect x="297" y="393" width="21" height="18" fill="#FFF8EA"/>
    <rect x="333" y="393" width="21" height="18" fill="#FFF8EA"/>
  </g>
</svg>
